name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Configure environment (.env)
        run: |
          cp .env.example .env
          if [ -n "${{ secrets.GOOGLE_MAPS_API_KEY }}" ]; then
            sed -i "s|your_google_maps_api_key_here|${{ secrets.GOOGLE_MAPS_API_KEY }}|g" .env
          fi
          if [ -n "${{ secrets.FIREBASE_WEB_API_KEY }}" ]; then
            sed -i "s|your_firebase_web_api_key_here|${{ secrets.FIREBASE_WEB_API_KEY }}|g" .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --release --base-href "/dhundo/"

      - name: Prepare GitHub Pages artifacts
        run: |
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
